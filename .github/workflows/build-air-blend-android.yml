name: Build AIR Blend Android APK

# Builds the AIR Blend Android APK (arm64-v8a) with the "lite" configuration
# (non essential features disabled for a smaller app and a faster build),
# then publishes it as a workflow artifact and as the "android-latest" release.

on:
  workflow_dispatch:
  push:
    branches: [ air-blend-android ]

permissions:
  contents: write

concurrency:
  group: air-blend-android
  # Queue new builds instead of cancelling a running one (keeps its compiler cache).
  cancel-in-progress: false

env:
  # Large files (Git LFS) are not stored on GitHub for this fork:
  # they are fetched from the upstream Blender server, which hosts the same objects.
  UPSTREAM_LFS: https://projects.blender.org/blender/blender.git/info/lfs
  BUILD_DIR: /mnt/air-blend-build

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /usr/local/share/powershell /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/chromium /usr/local/share/boost /opt/microsoft || true
          sudo docker image prune -a -f > /dev/null 2>&1 || true
          sudo mkdir -p "$BUILD_DIR" && sudo chown "$USER" "$BUILD_DIR"
          df -h / /mnt

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Compute download cache keys
        id: keys
        run: |
          git lfs ls-files --long --exclude="tests/**,lib/**" | awk '{print $1}' | sort > "$RUNNER_TEMP/lfs-oids.txt"
          echo "lfs=lfs-$(sha256sum "$RUNNER_TEMP/lfs-oids.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
          A=$(git ls-tree HEAD lib/android_arm64 | awk '{print $3}')
          L=$(git ls-tree HEAD lib/linux_x64 | awk '{print $3}')
          echo "libs=libs-${A:0:12}-${L:0:12}" >> "$GITHUB_OUTPUT"

      # Downloads are cached so the upstream server is only asked once per version.
      - name: Restore large files cache
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs/objects
          key: ${{ steps.keys.outputs.lfs }}
          restore-keys: lfs-

      - name: Fetch large files (Git LFS) from upstream
        run: |
          git lfs install --local
          git config lfs.url "$UPSTREAM_LFS"
          git config lfs.concurrenttransfers 4
          for attempt in 1 2 3 4 5; do
            if git lfs pull --exclude="tests/**,lib/**"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Upstream refused the large files download, try again later."
              exit 1
            fi
            echo "Download refused (attempt $attempt), retrying in $((attempt * 60))s..."
            sleep $((attempt * 60))
          done
          echo "Remaining LFS pointers in release/:"
          grep -rl "^version https://git-lfs" release/ | head -20 || true

      - name: Save large files cache
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs/objects
          key: ${{ steps.keys.outputs.lfs }}

      - name: Restore precompiled libraries cache
        id: libs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/android_arm64
            lib/linux_x64
          key: ${{ steps.keys.outputs.libs }}

      - name: Fetch precompiled libraries (Android arm64 + Linux host tools)
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          for lib in android_arm64 linux_x64; do
            path="lib/$lib"
            sha=$(git ls-tree HEAD "$path" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$path.url")
            echo "== $path @ $sha from $url"
            rm -rf "$path"
            git init -q "$path"
            git -C "$path" remote add origin "$url"
            git -C "$path" lfs install --local
            for attempt in 1 2 3 4 5; do
              if git -C "$path" fetch -q --depth 1 origin "$sha" && \
                 git -C "$path" checkout -q FETCH_HEAD && \
                 git -C "$path" lfs pull; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Unable to download $path, try again later."
                exit 1
              fi
              echo "Download failed (attempt $attempt), retrying in $((attempt * 60))s..."
              sleep $((attempt * 60))
            done
            # Only the files are needed: drop the Git data (halves the size and the cache).
            rm -rf "$path/.git"
            du -sh "$path"
          done
          df -h / /mnt

      - name: Save precompiled libraries cache
        if: steps.libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lib/android_arm64
            lib/linux_x64
          key: ${{ steps.keys.outputs.libs }}

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          NDK=$("$SDKM" --list 2>/dev/null | grep -oE "ndk;[0-9]+\.[0-9]+\.[0-9]+ " | sort -V | tail -1 | tr -d ' ')
          echo "Installing $NDK"
          "$SDKM" --install "$NDK" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK#ndk;}" >> "$GITHUB_ENV"

      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build ccache gcc-14 g++-14
          cmake --version | head -1

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      - name: Configure and build AIR Blend for Android
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache" CCACHE_MAXSIZE=4G
          # Host tools (makesdna, makesrna...) are built for Linux and need GCC 14+.
          # The Android target itself uses the NDK clang from the toolchain file.
          export CC=gcc-14 CXX=g++-14
          make android lite ninja ccache BUILD_DIR="$BUILD_DIR" ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          ccache -s || true
          df -h / /mnt

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ github.sha }}-${{ github.run_attempt }}

      - name: Assemble APK
        run: |
          cmake --build "$BUILD_DIR" --target gradle_assemble
          APK="$BUILD_DIR/gradle/app/build/outputs/apk/release/app-release.apk"
          mkdir -p out && cp "$APK" out/AIR-Blend-arm64.apk
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIR-Blend-Android
          path: out/AIR-Blend-arm64.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: AIR Blend Android (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            APK Android d'AIR Blend (arm64-v8a, Android 10 minimum, Vulkan requis).
            Compilé automatiquement depuis la branche air-blend-android (${{ github.sha }}).
          files: out/AIR-Blend-arm64.apk

      - name: Build log on failure
        if: failure()
        run: |
          df -h / /mnt || true
          tail -n 200 "$BUILD_DIR/CMakeFiles/CMakeError.log" 2>/dev/null || true
          tail -n 200 "$BUILD_DIR/CMakeFiles/CMakeConfigureLog.yaml" 2>/dev/null || true
